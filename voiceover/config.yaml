# Voiceover pipeline configuration. Edit values here; re-run make_voiceover.py to regenerate.
video: ergoaidesk            # ergoaidesk | ergofix

# --- Scene budgets (seconds), in script order -------------------------------------------
budgets:
  ergoaidesk: {hook: 20, problem: 25, gap: 15, solution: 40, demo: 40, results: 20, closing: 20}
  ergofix:    {hook: 28, problem: 18, gap: 22, bridge: 7, innovation: 20, feature1: 22, feature2: 19, feature3: 19, impact: 16, closing: 9}

script:
  ergoaidesk: ../reference/Skenario_Lomba_OUM.pdf       # parsed with pdftotext -layout
  ergofix:    ../reference/ergofix-narration.md         # one block per scene, headed by scene name

# --- Speakers / take selection (used from the choose-takes stage onward) -----------------
raw_dir: ../raw                 # speaker label = sub-folder name (raw/A, raw/B). Never guessed from audio.
voice_mode: best_per_scene      # best_per_scene | single_voice
max_switches: 2
switch_penalty: 0.10
exclude: []                     # take files (relative to raw_dir) to ignore
wer_max: 0.15                   # no take at or below this -> scene flagged RE-RECORD
target_wpm: 130

# --- Segmentation -------------------------------------------------------------------------
segmentation:
  min_silence_s: 0.7            # split at silences longer than this
  frame_ms: 20
  threshold_above_floor_db: 8   # speech threshold = noise floor (quietest 10 %) + this
  min_segment_s: 0.40           # ignore blips shorter than this (clicks)
  max_segment_s: 28.0           # ASR window limit is 30 s; longer segments split at the quietest frame
  min_words_for_scene: 4        # segments with fewer ASR words (after dropping non-speech tags) are left unassigned
  pad_s: 0.10                   # context added around a segment when sent to ASR

# --- ASR (local only; audio never leaves the machine) -------------------------------------
asr:
  engine: sherpa-onnx-whisper   # OpenAI Whisper small.en converted to ONNX (k2-fsa release). Not faster-whisper:
                                # huggingface.co is blocked in this environment.
  model_dir: models/sherpa-onnx-whisper-small.en
  num_threads: 4
  word_timestamps: false        # this export has no cross-attention outputs -> segment-level times only

# --- Terms whose transcription result is printed so pronunciation can be checked by ear --
glossary:
  - YOLOv11
  - musculoskeletal
  - ergonomic
  - six degrees of freedom
  - psychosocial
  - ERGO-AI DESK
  - RULA

fillers: [um, uh, uhm, er, erm, hmm, ah]

# --- Build stage (take scoring, cleaning, levelling, assembly) ---------------------------
# Score = lower is better. Every term is a measurement; nothing is judged by ear.
weights:
  wer: 1.0                # WER vs script (ASR-based, see report caveat)
  pacing: 0.30            # x |wpm - target_wpm| / target_wpm
  pause: 0.02             # per pause longer than pause_max_s
  noise: 0.005            # per dB the take's noise floor is above -45 dBFS
  clipping: 0.10          # x min(1, clipped samples / build.clip_full_penalty_samples)
  filler: 0.05            # per filler word or immediate repeat in the ASR text
build:
  lead_tail_s: 0.15       # silence kept before / after the voice
  safety_s: 0.08          # extra context kept around each detected segment so word onsets are not clipped
  pause_max_s: 0.8        # internal pauses longer than this ...
  pause_to_s: 0.5         # ... are shortened to this
  fade_ms: 20
  max_stretch: 0.03       # atempo applied only if it alone brings the scene within budget (<= 3 %)
  roomtone_s: 1.0
  nr_db_try: [8, 6, 4, 2] # afftdn strength tried in order; first whose measured floor reduction is <= max_floor_reduction_db
  max_floor_reduction_db: 10
  deess_threshold_db: 6   # heuristic, uncalibrated: p95(5-9 kHz band) - median(1-4 kHz band) over speech frames
  deess_amount: 0.2
  loudness: {I: -16.0, TP: -1.5, LRA: 11, tolerance_LU: 1.0, tp_guard: 0.02}
  f0_spread_flag: 0.15    # relative spread of median F0 across chosen scenes that triggers the voice-consistency warning
  clip_full_penalty_samples: 20
  hp_hz: 65               # 2nd-order high-pass; recording has strong subsonic/rumble energy
  notch_hz: 48.3          # tonal hum peak measured in the silent frames of AI_No_Cut_Audio.mp3 (re-measure for new recordings)
  notch_q: 20
  floor_risk_dbfs: -40    # post-high-pass floor above this -> ARTEFACT RISK flag
  deess_enabled: false    # heuristic flagged every scene, so it does not discriminate; index is reported only
  voice_group_split_hz: 175  # measured median-F0 gap between two acoustic groups (takes cluster at 120-154 and 210-242 Hz). NOT a speaker label.
